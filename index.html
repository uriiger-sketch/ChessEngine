<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ChessNN">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/icon-192.png">

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json">

  <title>ChessNN</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Chess board -->
  <div id="board-wrap">
    <div id="board"></div>
    <!-- Help mode draws its suggested moves here, over the squares -->
    <svg id="hint-layer" viewBox="0 0 800 800" aria-hidden="true"></svg>
    <!-- AI thinking spinner (shown during engine search) -->
    <div id="thinking-overlay" hidden>
      <div class="spinner"></div>
    </div>
  </div>

  <!-- Controls below the board -->
  <div id="controls">
    <div id="status">Loading…</div>

    <!-- Evaluation bar: white fill (left) = white winning probability -->
    <div id="eval-wrap">
      <div id="eval-bar"><div id="eval-white-fill"></div></div>
      <span id="eval-text">+0.0</span>
    </div>

    <!-- Help mode: the player's three best moves, matching the arrows -->
    <div id="hint-panel" aria-live="polite"></div>

    <div id="captured-wrap"></div>

    <!-- Think time selector -->
    <div class="btn-row">
      <button class="ctrl-btn" data-time="2000">2s</button>
      <button class="ctrl-btn active" data-time="5000">5s</button>
      <button class="ctrl-btn" data-time="10000">10s</button>
    </div>

    <!-- Color selection -->
    <div class="btn-row">
      <button class="ctrl-btn active" id="play-white-btn">Play White</button>
      <button class="ctrl-btn" id="play-black-btn">Play Black</button>
    </div>

    <div class="btn-row">
      <button class="ctrl-btn" id="new-game-btn">New Game</button>
      <!-- Learn and Help modes: back to the start of your last turn -->
      <button class="ctrl-btn" id="back-btn" disabled
              title="Back to the start of your last turn, to play a different move. Once per move.">&#8630; Back</button>
    </div>

    <!-- Mode: a segmented switch, usable at any point in a game -->
    <div id="mode-switch" role="radiogroup" aria-label="Mode" data-mode="play">
      <span class="mode-thumb" aria-hidden="true"></span>
      <button class="mode-btn" role="radio" data-mode="play"  aria-checked="true">Play</button>
      <button class="mode-btn" role="radio" data-mode="learn" aria-checked="false">Learn</button>
      <button class="mode-btn" role="radio" data-mode="help"  aria-checked="false">Help me</button>
    </div>
    <div id="mode-caption"></div>

    <div id="footer">
      <div id="version">v2.3</div>
      <div id="credit">credit: igeru</div>
    </div>
  </div>

  <!-- Pawn promotion modal -->
  <div id="promo-modal" hidden>
    <div id="promo-choices"></div>
  </div>

  <!-- Yes / No confirmation (New Game, changing colour mid-game) -->
  <div id="confirm-modal" hidden>
    <div class="confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
      <div id="confirm-title">Start a new game?</div>
      <div id="confirm-sub">The current game will be lost.</div>
      <div class="confirm-actions">
        <button class="ctrl-btn" id="confirm-no">No</button>
        <button class="ctrl-btn confirm-yes" id="confirm-yes">Yes</button>
      </div>
    </div>
  </div>

  <!-- UI module (loads chess.js, engine.js, neural.js via imports) -->
  <script type="module" src="js/ui.js"></script>

  <!-- Service worker registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
